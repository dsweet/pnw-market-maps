<!doctype html>
<!-- generated by scripts/build_daily_dashboard.py — do not hand-edit -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PNW Daily Listings</title>
<style>
:root{
  color-scheme: light;
  --bg:#f6f4ee; --ink:#252a23; --muted:#6b7263; --line:#ddd8cb;
  --card:#fdfcf9; --accent:#33604a; --accent-ink:#f2efe6;
  --good:#0ca30c; --warn:#b97e00; --crit:#d03b3b; --warn-wash:#fab21922;
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme: dark;
    --bg:#1c201b; --ink:#e8e6dd; --muted:#9aa190; --line:#3a4036;
    --card:#242922; --accent:#6fae8f; --accent-ink:#161a15;
    --good:#0ca30c; --warn:#fab219; --crit:#e66767; --warn-wash:#fab21926; }
}
*{box-sizing:border-box; margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg); color:var(--ink);
  font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  padding-bottom:40px}
main{max-width:640px; margin:0 auto; padding:0 12px}
a{color:inherit}

header{position:sticky; top:0; z-index:10; background:var(--bg);
  border-bottom:1px solid var(--line); padding:10px 12px 8px}
.hwrap{max-width:640px; margin:0 auto}
h1{font-size:18px; letter-spacing:-.01em; display:flex; align-items:baseline; gap:8px}
h1 small{font-size:12px; color:var(--muted); font-weight:400}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}
.chip{font-size:12px; color:var(--muted); background:var(--card);
  border:1px solid var(--line); border-radius:999px; padding:2px 9px;
  white-space:nowrap}
.chip.good{color:var(--good); border-color:var(--good)}
.chip.crit{color:var(--crit); border-color:var(--crit); cursor:pointer}
#errdetail{display:none; font-size:12px; color:var(--crit); margin-top:6px;
  white-space:pre-wrap}
#stale{display:none; background:var(--warn-wash); border:1px solid var(--warn);
  color:var(--ink); border-radius:8px; padding:8px 12px; margin:10px auto 0;
  max-width:640px; font-size:13px}

nav{display:flex; gap:6px; margin:12px 0 0; flex-wrap:wrap}
.seg{display:flex; background:var(--card); border:1px solid var(--line);
  border-radius:8px; overflow:hidden; width:100%}
.seg button{flex:1; border:0; background:none; color:var(--muted);
  font:inherit; font-size:13.5px; padding:8px 4px; cursor:pointer}
.seg button.on{background:var(--accent); color:var(--accent-ink); font-weight:600}
.tabs{display:flex; gap:6px; width:100%}
.tabs button{flex:1; border:1px solid var(--line); background:var(--card);
  color:var(--muted); font:inherit; font-size:13px; padding:6px 4px;
  border-radius:8px; cursor:pointer; white-space:nowrap}
.tabs button.on{border-color:var(--accent); color:var(--ink); font-weight:600}
.tabs .n{font-size:11px; color:var(--muted)}
.tabs button.on .n{color:var(--accent)}

.bar{display:flex; gap:8px; align-items:center; margin:10px 0; font-size:13px}
.bar select{font:inherit; font-size:13px; background:var(--card);
  color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:4px 6px}
details.flt{margin-left:auto}
details.flt summary{cursor:pointer; color:var(--muted); list-style:none;
  border:1px solid var(--line); background:var(--card); border-radius:6px;
  padding:4px 10px}
details.flt summary::-webkit-details-marker{display:none}
details.flt[open] summary{border-color:var(--accent); color:var(--ink)}
#fltbody{position:absolute; right:0; z-index:9; margin-top:6px; width:min(420px, calc(100vw - 24px));
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:12px; box-shadow:0 6px 24px rgba(0,0,0,.12)}
.fltrow{margin-bottom:10px}
.fltrow:last-child{margin-bottom:0}
.fltrow .lbl{font-size:11px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--muted); margin-bottom:5px}
.fchips{display:flex; flex-wrap:wrap; gap:5px}
.fchips button{font:inherit; font-size:12px; border:1px solid var(--line);
  background:none; color:var(--muted); border-radius:999px; padding:2px 9px;
  cursor:pointer}
.fchips button.on{border-color:var(--accent); color:var(--ink);
  background:var(--accent-ink)}
@media (prefers-color-scheme: dark){ .fchips button.on{background:#2e3a30} }
.fltrow input{font:inherit; font-size:13px; width:90px; background:var(--bg);
  color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:4px 6px}

.hint{font-size:12.5px; color:var(--muted); margin:8px 0}
.empty{color:var(--muted); text-align:center; padding:36px 0; font-size:14px}
.empty .links a{color:var(--accent)}

section.bin{margin-bottom:10px}
.binhead{display:flex; align-items:center; gap:8px; width:100%;
  border:0; background:none; color:var(--ink); font:inherit; font-weight:600;
  font-size:14px; padding:8px 2px; cursor:pointer; border-bottom:1px solid var(--line)}
.binhead .n{font-weight:400; font-size:12px; color:var(--muted);
  background:var(--card); border:1px solid var(--line); border-radius:999px;
  padding:1px 8px}
.binhead .tri{margin-left:auto; color:var(--muted); font-size:11px;
  transition:transform .12s}
.bin.open .tri{transform:rotate(90deg)}

.row{display:block; background:var(--card); border:1px solid var(--line);
  border-radius:8px; padding:8px 11px; margin:7px 0}
.row:active{border-color:var(--accent)}
.rmain{display:flex; align-items:stretch}
.rlink{flex:1; min-width:0; display:block; text-decoration:none; color:inherit}
.xbtn{border:0; background:none; color:var(--muted); font-size:10px;
  padding:0 2px 0 12px; cursor:pointer; transition:transform .12s}
.xbtn.on{transform:rotate(90deg); color:var(--accent)}
.xp{border-top:1px solid var(--line); margin-top:8px; padding-top:8px}
.drv{display:grid; grid-template-columns:1fr 1fr; gap:3px 18px}
.drv .d{display:flex; justify-content:space-between; gap:8px; font-size:12.5px;
  color:var(--muted)}
.drv b.up{color:var(--good); font-variant-numeric:tabular-nums}
.drv b.dn{color:var(--crit); font-variant-numeric:tabular-nums}
.xnote{font-size:11px; color:var(--muted); margin-top:6px}
.fbk{font-size:12.5px; margin-top:6px}
.fbk a{color:var(--accent)}
.l1{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.l1 .price{font-weight:700; font-variant-numeric:tabular-nums}
.l1 .addr{font-size:14px; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; flex:1; min-width:0}
.l2{font-size:12.5px; color:var(--muted); margin-top:2px; display:flex;
  flex-wrap:wrap; gap:4px 10px; align-items:baseline}
.badge{font-size:10px; font-weight:700; letter-spacing:.03em;
  border:1px solid var(--line); border-radius:4px; padding:0 4px;
  color:var(--muted)}
.badge.sc{color:var(--accent); border-color:var(--accent)}
.cut{color:var(--good); font-weight:600; font-size:12px}
.cut s{color:var(--muted); font-weight:400}
.rel{color:var(--warn); font-weight:600; font-size:11px}
.row.gone{opacity:.62}
.row.gone .price{text-decoration:line-through; font-weight:400}
.more{display:block; width:100%; font:inherit; font-size:13px; color:var(--accent);
  background:none; border:1px dashed var(--line); border-radius:8px;
  padding:8px; margin:6px 0; cursor:pointer}
.daytag{font-size:11px; color:var(--muted)}

footer{max-width:640px; margin:36px auto 0; padding:14px 12px 0;
  border-top:1px solid var(--line); color:var(--muted); font-size:12.5px}
footer a{color:var(--accent)}
</style>
</head>
<body>
<header><div class="hwrap">
  <h1>PNW Daily Listings <small id="builtat"></small></h1>
  <div class="chips" id="health"></div>
  <div id="errdetail"></div>
</div></header>
<div id="stale"></div>
<main>
  <nav><div class="seg" id="views">
    <button data-v="foryou">New for you</button>
    <button data-v="today">Today</button>
    <button data-v="all">All active</button>
  </div></nav>
  <nav><div class="tabs" id="streams">
    <button data-s="new">New <span class="n"></span></button>
    <button data-s="cuts">Price cuts <span class="n"></span></button>
    <button data-s="del">Delisted <span class="n"></span></button>
  </div></nav>
  <nav><div class="tabs" id="tabs">
    <button data-t="h">Houses <span class="n"></span></button>
    <button data-t="l">Land <span class="n"></span></button>
    <button data-t="o">Other <span class="n"></span></button>
  </div></nav>
  <div class="bar">
    <label for="sort" style="color:var(--muted)">Sort</label>
    <select id="sort">
      <option value="sc" selected>Score</option>
      <option value="new">Newest</option>
      <option value="pd">Price ↓</option>
      <option value="pa">Price ↑</option>
      <option value="ppa">$/acre</option>
      <option value="pps">$/sqft</option>
    </select>
    <details class="flt" id="flt">
      <summary>Filters</summary>
      <div id="fltbody">
        <div class="fltrow"><div class="lbl">Tier</div>
          <div class="fchips" id="tierchips"></div></div>
        <div class="fltrow"><div class="lbl">Area</div>
          <div class="fchips" id="countychips"></div></div>
        <div class="fltrow"><div class="lbl">Price</div>
          <input id="pmin" inputmode="text" placeholder="min (500k)">
          –
          <input id="pmax" inputmode="text" placeholder="max (2m)">
        </div>
      </div>
    </details>
  </div>
  <div class="hint" id="hint"></div>
  <div id="content"></div>
</main>
<footer>
  Maps: <a href="listing-explorer.html">Listing Explorer</a> ·
  <a href="suncadia-explorer.html">Suncadia Time Explorer</a><br>
  Sources: Redfin &amp; LandWatch feeds, scraped daily. Data refreshed each
  morning by the panel watcher.
</footer>
<script>
"use strict";
const BUILT = "2026-08-07T04:55:44+00:00";
const PREFIX = {r:"https://www.redfin.com", l:"https://www.landwatch.com"};
const SRCLAB = {r:"R", l:"LW"};
const TIERS = [["c","Candidate"],["a","Adjacent"],["p","Personal"]];
const COUNTY = {chelan:"Chelan", graysharbor:"Grays Harbor", island:"Island",
  jefferson:"Jefferson", kittitas:"Kittitas", mason:"Mason",
  okanogan:"Okanogan", sanjuan:"San Juan", vashon:"Vashon",
  bainbridge:"Bainbridge", "fox-island":"Fox Island", "lake-tapps":"Lake Tapps"};
const BINS = [
  [2e6, Infinity, "$2M+"], [1e6, 2e6, "$1–2M"], [5e5, 1e6, "$500k–1M"],
  [2.5e5, 5e5, "$250–500k"], [1e5, 2.5e5, "$100–250k"], [0, 1e5, "<$100k"]];
const CATLAB = {m:"MFG", c:"CONDO"};
const LS_DAY = "lwdash.lastSeenDay", LS_VISIT = "lwdash.lastVisit";
// driver codes — keep in sync with DIM_CODE/PEN_CODE in the builder
const DRVLAB = {v:"Value", a:"Access", p:"Phase", c:"Scarcity",
  t:"Mkt strength", h:"Deal heat", m:"Amenities", q:"Specs",
  H:"HOA fee", W:"Highway", S:"Seasonal access", O:"Off-grid"};
// feedback service on the mini (LAN name at home, Tailscale IP elsewhere)
const FEEDBACK_HOSTS = [["home", "http://claws-mac-mini.local:8787"],
                        ["tailscale", "http://100.124.16.84:8787"]];

// row indices — keep in sync with the builder
const SRC=0, URLP=1, CTY=2, TIER=3, ADDR=4, CITY=5, TAB=6, CAT=7,
      ACRES=8, SQFT=9, BEDS=10, PRICE=11, LISTED=12, SCORE=13, DRV=14;

let DAILY = null, ACTIVE = null, activeLoading = false;
const state = {
  view: "foryou", stream: "new", tab: "h", sort: "sc",
  tiers: new Set(["c","a","p"]), counties: new Set(Object.keys(COUNTY)),
  pmin: null, pmax: null,
  open: new Set(),   // expanded bins (all-active view)
  full: new Set(),   // bins with the >200 cap lifted
  exp: new Set(),    // unfolded listing cards (src+urlPath keys)
  lastSeen: null, fallback: false,
};

// ---------- formatting ----------
const esc = s => (s || "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtPrice = p => p == null ? "—" :
  p >= 1e6 ? "$" + (p/1e6).toFixed(p % 1e6 >= 5e4 ? 2 : 1).replace(/\.?0+$/,"") + "M" :
  "$" + Math.round(p/1e3) + "k";
const fmtMoney = v => v >= 1e6 ? "$" + (v/1e6).toFixed(1).replace(/\.0$/,"") + "M" :
  v >= 1e3 ? "$" + Math.round(v/1e3) + "k" : "$" + Math.round(v);
const fmtAcres = a => a >= 10 ? Math.round(a) + " ac" :
  (Math.round(a*10)/10) + " ac";
const perAcre = r => r[PRICE] && r[ACRES] ? r[PRICE]/r[ACRES] : null;
const perSqft = r => r[PRICE] && r[SQFT] ? r[PRICE]/r[SQFT] : null;
const fmtDay = d => new Date(d + "T12:00:00")
  .toLocaleDateString(undefined, {month:"short", day:"numeric"});
const parseMoney = s => {
  const m = /^\s*\$?([\d.]+)\s*([km])?\s*$/i.exec(s || "");
  if (!m) return null;
  const mult = m[2] ? (m[2].toLowerCase() === "m" ? 1e6 : 1e3) : 1;
  return Math.round(parseFloat(m[1]) * mult);
};

// ---------- health ----------
function renderHealth() {
  const h = DAILY.health, el = document.getElementById("health");
  const built = new Date(BUILT);
  const fin = h.finished ? new Date(h.finished) : built;
  document.getElementById("builtat").textContent =
    fin.toLocaleString(undefined, {weekday:"short", hour:"numeric", minute:"2-digit"});
  const chips = [];
  if (h.errors.length)
    chips.push(`<span class="chip crit" id="errchip">✗ ${h.errors.length} of ${h.total} runs failed</span>`);
  else
    chips.push(`<span class="chip good">✓ ${h.ok}/${h.total} runs</span>`);
  chips.push(`<span class="chip">${h.fetched.toLocaleString()} listings checked</span>`);
  el.innerHTML = chips.join("");
  if (h.errors.length) {
    document.getElementById("errchip").onclick = () => {
      const d = document.getElementById("errdetail");
      d.style.display = d.style.display === "block" ? "none" : "block";
      d.textContent = h.errors.map(e => `${e[0]}/${e[1]}: ${e[2] || "failed"}`).join("\n");
    };
  }
  const ageH = (Date.now() - built.getTime()) / 36e5;
  if (ageH > 26) {
    const s = document.getElementById("stale");
    s.style.display = "block";
    s.innerHTML = `⚠ Data is stale — last build ${Math.round(ageH)}h ago (` +
      built.toLocaleString() + `). The scraper or publisher may be down.`;
  }
}

// ---------- data selection ----------
function feedDays() {
  if (state.view === "today") return DAILY.days.slice(0, 1);
  // "new for you": strictly after last seen day
  const seen = state.lastSeen;
  if (!seen) { state.fallback = true; return DAILY.days.slice(0, 1); }
  const ds = DAILY.days.filter(d => d.d > seen);
  if (!ds.length) return [];
  return ds;
}

function passes(r) {
  if (!state.tiers.has(r[TIER]) && r[TIER]) return false;
  if (!state.counties.has(r[CTY]) && COUNTY[r[CTY]]) return false;
  if (state.pmin != null && (r[PRICE] == null || r[PRICE] < state.pmin)) return false;
  if (state.pmax != null && (r[PRICE] == null || r[PRICE] > state.pmax)) return false;
  return true;
}

// rows for current view+stream (before tab split); feed rows get day attached
function currentRows() {
  if (state.view === "all")
    return ACTIVE ? ACTIVE.rows.filter(passes).map(r => [r, null]) : [];
  const out = [];
  for (const d of feedDays())
    for (const r of d[state.stream])
      if (passes(r)) out.push([r, d.d]);
  return out;
}

// ---------- sorting ----------
function sortRows(rows) {
  const key = state.sort;
  const val = ([r]) => key === "pd" || key === "pa" ? r[PRICE] :
    key === "ppa" ? perAcre(r) : key === "pps" ? perSqft(r) : null;
  if (key === "new") {
    rows.sort((a, b) => (b[1] || "").localeCompare(a[1] || "") ||
      (b[0][LISTED] || "").localeCompare(a[0][LISTED] || "") ||
      (b[0][PRICE] || 0) - (a[0][PRICE] || 0));
    return rows;
  }
  if (key === "sc") {  // score desc, unscored last, then price desc
    rows.sort((a, b) => {
      const sa = a[0][SCORE], sb = b[0][SCORE];
      if (sa == null && sb == null) return (b[0][PRICE] || 0) - (a[0][PRICE] || 0);
      if (sa == null) return 1;
      if (sb == null) return -1;
      return (sb - sa) || (b[0][PRICE] || 0) - (a[0][PRICE] || 0);
    });
    return rows;
  }
  const dir = key === "pd" ? -1 : 1;
  rows.sort((a, b) => {
    const va = val(a), vb = val(b);
    if (va == null && vb == null) return 0;
    if (va == null) return 1;  // nulls last
    if (vb == null) return -1;
    return dir * (va - vb);
  });
  return rows;
}

// ---------- rendering ----------
function rowHTML(rd) {
  const [r, day] = rd;
  const url = r[URLP].startsWith("http") ? r[URLP] : PREFIX[r[SRC]] + r[URLP];
  const gone = state.view !== "all" && state.stream === "del";
  const bits = [];
  if (r[CITY]) bits.push(esc(r[CITY]));
  bits.push(COUNTY[r[CTY]] || esc(r[CTY]));
  if (r[TAB] === "l") {
    if (r[ACRES]) bits.push(fmtAcres(r[ACRES]));
    const pa = perAcre(r);
    if (pa) bits.push(fmtMoney(pa) + "/ac");
  } else {
    if (r[BEDS]) bits.push(r[BEDS] + " bd");
    if (r[SQFT]) bits.push(r[SQFT].toLocaleString() + " sf");
    const ps = perSqft(r);
    if (ps) bits.push("$" + Math.round(ps) + "/sf");
    if (r[ACRES] && r[ACRES] >= 0.5) bits.push(fmtAcres(r[ACRES]));
  }
  let chip = "";
  if (state.view !== "all" && state.stream === "cuts" && r.length > 16) {
    const [old, nw] = [r[15], r[16]];
    const pct = old > 0 ? Math.round((old - nw) / old * 1000) / 10 : null;
    chip = ` <span class="cut">↓${pct != null ? " " + pct + "%" : ""} <s>${fmtPrice(old)}</s></span>`;
  } else if (state.view !== "all" && state.stream === "new" && r[15]) {
    chip = ` <span class="rel">relisted</span>`;
  }
  const badges =
    (r[SCORE] != null ? `<span class="badge sc">${r[SCORE]}</span> ` : "") +
    `<span class="badge">${SRCLAB[r[SRC]] || "?"}</span>` +
    (CATLAB[r[CAT]] ? ` <span class="badge">${CATLAB[r[CAT]]}</span>` : "");
  const daytag = day && feedSpansDays ? `<span class="daytag">${fmtDay(day)}</span>` : "";
  const title = esc(r[ADDR]) || esc(r[CITY]) || (COUNTY[r[CTY]] || esc(r[CTY]));
  const key = r[SRC] + r[URLP];
  const open = state.exp.has(key);
  return `<div class="row${gone ? " gone" : ""}">
    <div class="rmain"><a class="rlink" href="${esc(url)}" target="_blank" rel="noopener">
    <div class="l1"><span class="price">${fmtPrice(r[PRICE])}</span>${chip}<span class="addr">${title}</span></div>
    <div class="l2">${bits.join(" · ")} ${badges} ${daytag}</div></a>
    <button class="xbtn${open ? " on" : ""}" data-xp="${esc(key)}" aria-label="score details">▶</button></div>
    ${open ? xpHTML(r, url) : ""}</div>`;
}

// unfolded card body: top-5 score drivers + feedback links to the mini
function xpHTML(r, url) {
  let top;
  if (r[DRV] && r[DRV].length) {
    top = `<div class="drv">` + r[DRV].map(d =>
      `<div class="d"><span>${DRVLAB[d[0]] || d[0]}${
        "HWSO".includes(d[0]) ? "" : " " + d[1]}</span><b class="${
        d[2] >= 0 ? "up" : "dn"}">${d[2] >= 0 ? "+" : "−"}${Math.abs(d[2])}</b></div>`).join("") +
      `</div><div class="xnote">top drivers · score ${r[SCORE]} · points of pull vs a neutral 50</div>`;
  } else {
    top = `<div class="xnote">No score breakdown for this listing (unscored tier, inactive, or too little data).</div>`;
  }
  const q = `src=${r[SRC]}&county=${encodeURIComponent(r[CTY])}` +
    `&score=${r[SCORE] == null ? "" : r[SCORE]}` +
    `&addr=${encodeURIComponent(r[ADDR] || r[CITY] || "")}` +
    `&url=${encodeURIComponent(url)}`;
  const links = FEEDBACK_HOSTS.map(h =>
    `<a href="${h[1]}/fb?${q}" target="_blank" rel="noopener">${h[0]}</a>`).join(" · ");
  return `<div class="xp">${top}<div class="fbk">✍️ Feedback: ${links}</div></div>`;
}

let feedSpansDays = false;

function binRows(rows) {
  const bins = BINS.map(() => []);
  const noprice = [];
  for (const rd of rows) {
    const p = rd[0][PRICE];
    if (p == null) { noprice.push(rd); continue; }
    for (let i = 0; i < BINS.length; i++)
      if (p >= BINS[i][0] && p < BINS[i][1]) { bins[i].push(rd); break; }
  }
  return {bins, noprice};
}

const CAP = 200;

function sectionHTML(label, rows, idx) {
  const isAll = state.view === "all";
  const open = !isAll || state.open.has(idx);
  let body = "";
  if (open) {
    const shown = (isAll && !state.full.has(idx)) ? rows.slice(0, CAP) : rows;
    body = shown.map(rowHTML).join("");
    if (shown.length < rows.length)
      body += `<button class="more" data-more="${idx}">Show ${(rows.length - shown.length).toLocaleString()} more</button>`;
  }
  return `<section class="bin${open ? " open" : ""}">
    <button class="binhead" data-bin="${idx}">${label}
      <span class="n">${rows.length.toLocaleString()}</span><span class="tri">▶</span></button>
    <div class="binbody">${body}</div></section>`;
}

function render() {
  // view segment + nav visibility
  document.querySelectorAll("#views button").forEach(b =>
    b.classList.toggle("on", b.dataset.v === state.view));
  document.getElementById("streams").parentElement.style.display =
    state.view === "all" ? "none" : "";
  state.fallback = false;

  const content = document.getElementById("content");
  const hint = document.getElementById("hint");
  hint.textContent = "";

  if (state.view === "all" && !ACTIVE) {
    content.innerHTML = `<div class="empty">Loading all active listings…</div>`;
    loadActive();
    return;
  }

  const rows = currentRows();
  const days = state.view === "all" ? [] : feedDays();
  feedSpansDays = days.length > 1;

  // stream + tab counts under current filters (tab counts within stream)
  if (state.view !== "all") {
    for (const s of ["new", "cuts", "del"]) {
      let n = 0;
      for (const d of days) n += d[s].filter(passes).length;
      document.querySelector(`#streams [data-s="${s}"] .n`).textContent = n;
    }
  }
  document.querySelectorAll("#streams button").forEach(b =>
    b.classList.toggle("on", b.dataset.s === state.stream));
  for (const t of ["h", "l", "o"]) {
    const n = rows.filter(([r]) => r[TAB] === t).length;
    document.querySelector(`#tabs [data-t="${t}"] .n`).textContent = n;
  }
  document.querySelectorAll("#tabs button").forEach(b =>
    b.classList.toggle("on", b.dataset.t === state.tab));

  const tabRows = sortRows(rows.filter(([r]) => r[TAB] === state.tab));

  // hints / empty states
  if (state.view === "foryou") {
    if (state.fallback)
      hint.textContent = "First visit on this device — showing the latest batch. " +
        "Future visits show everything since your last one. " +
        "(Tip: open in Safari, not the Telegram viewer, so it remembers.)";
    else if (days.length)
      hint.textContent = `Since your last visit: ${days.length} day${days.length > 1 ? "s" : ""} of activity.`;
  }
  if (!tabRows.length) {
    const built = DAILY.days.length ? fmtDay(DAILY.days[0].d) : "";
    content.innerHTML = `<div class="empty">${
      state.view === "foryou" && !days.length
        ? `Nothing new since your last visit (${built} batch already seen).`
        : "Nothing here with the current filters."
      }<div class="links" style="margin-top:10px">
      <a href="#" id="goToday">See today</a> · <a href="#" id="goAll">All active</a></div></div>`;
    document.getElementById("goToday").onclick = e => { e.preventDefault(); setView("today"); };
    document.getElementById("goAll").onclick = e => { e.preventDefault(); setView("all"); };
    markSeen();
    return;
  }

  const {bins, noprice} = binRows(tabRows);
  let html = "";
  bins.forEach((b, i) => { if (b.length) html += sectionHTML(BINS[i][2], b, i); });
  if (noprice.length) html += sectionHTML("No price", noprice, BINS.length);
  content.innerHTML = html;

  content.querySelectorAll("[data-bin]").forEach(b => b.onclick = () => {
    const i = +b.dataset.bin;
    if (state.view !== "all") { // feed bins just collapse/expand in place
      b.parentElement.classList.toggle("open");
      const bb = b.parentElement.querySelector(".binbody");
      bb.style.display = bb.style.display === "none" ? "" : "none";
      return;
    }
    state.open.has(i) ? state.open.delete(i) : state.open.add(i);
    render();
  });
  content.querySelectorAll("[data-more]").forEach(b => b.onclick = () => {
    state.full.add(+b.dataset.more);
    render();
  });
  content.querySelectorAll("[data-xp]").forEach(b => b.onclick = () => {
    const k = b.dataset.xp;
    state.exp.has(k) ? state.exp.delete(k) : state.exp.add(k);
    render();
  });
  markSeen();
}

let seenMarked = false;
function markSeen() {
  if (seenMarked || !DAILY.days.length) return;
  seenMarked = true;
  try {
    localStorage.setItem(LS_DAY, DAILY.days[0].d);
    localStorage.setItem(LS_VISIT, new Date().toISOString());
  } catch (e) { /* private mode */ }
}

function setView(v) {
  state.view = v;
  state.open = new Set();
  state.full = new Set();
  if (v === "all" && state.sort === "new") state.sort = "sc";
  document.getElementById("sort").value = state.sort;
  render();
}

function loadActive() {
  if (activeLoading) return;
  activeLoading = true;
  fetch("active.json?v=" + BUILT.slice(0, 10), {cache: "no-cache"})
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(j => { ACTIVE = j; render(); })
    .catch(e => {
      activeLoading = false;
      document.getElementById("content").innerHTML =
        `<div class="empty">Couldn’t load active listings (${esc(String(e))}).
         <div class="links"><a href="#" onclick="location.reload()">Reload</a></div></div>`;
    });
}

// ---------- controls ----------
function buildFilterChips() {
  const tc = document.getElementById("tierchips");
  tc.innerHTML = TIERS.map(([c, lab]) =>
    `<button data-tier="${c}" class="on">${lab}</button>`).join("");
  tc.querySelectorAll("button").forEach(b => b.onclick = () => {
    const c = b.dataset.tier;
    state.tiers.has(c) ? state.tiers.delete(c) : state.tiers.add(c);
    b.classList.toggle("on");
    render();
  });
  const cc = document.getElementById("countychips");
  cc.innerHTML = Object.entries(COUNTY).map(([slug, lab]) =>
    `<button data-cty="${slug}" class="on">${lab}</button>`).join("");
  cc.querySelectorAll("button").forEach(b => b.onclick = () => {
    const c = b.dataset.cty;
    state.counties.has(c) ? state.counties.delete(c) : state.counties.add(c);
    b.classList.toggle("on");
    render();
  });
  for (const id of ["pmin", "pmax"]) {
    document.getElementById(id).addEventListener("change", e => {
      state[id] = parseMoney(e.target.value);
      render();
    });
  }
}

document.querySelectorAll("#views button").forEach(b =>
  b.onclick = () => setView(b.dataset.v));
document.querySelectorAll("#streams button").forEach(b =>
  b.onclick = () => { state.stream = b.dataset.s; render(); });
document.querySelectorAll("#tabs button").forEach(b =>
  b.onclick = () => { state.tab = b.dataset.t; render(); });
document.getElementById("sort").onchange = e => { state.sort = e.target.value; render(); };
document.addEventListener("click", e => {
  const f = document.getElementById("flt");
  if (f.open && !f.contains(e.target)) f.open = false;
});

// ---------- boot ----------
try { state.lastSeen = localStorage.getItem(LS_DAY); } catch (e) {}
buildFilterChips();
fetch("daily.json?v=" + BUILT.slice(0, 10), {cache: "no-cache"})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(j => { DAILY = j; renderHealth(); render(); })
  .catch(e => {
    document.getElementById("content").innerHTML =
      `<div class="empty">Couldn’t load the daily feed (${esc(String(e))}).<br>
       If you opened this as a local file, serve it instead:
       <code>python3 -m http.server</code></div>`;
  });
</script>
</body>
</html>
